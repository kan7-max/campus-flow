<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />
    <title>Campus TaskFlow</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
        background: #0b1120;
        color: #e8eef8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(900px circle at 10% -10%, rgba(34, 211, 238, 0.16), transparent 55%),
          #0b1120;
      }

      main {
        width: min(100%, 440px);
        border: 1px solid rgba(115, 137, 176, 0.24);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.82);
        padding: 24px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      }

      img {
        width: 56px;
        height: 56px;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #9fb0c8;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 20px;
        border-radius: 10px;
        background: #22d3ee;
        color: #082033;
        padding: 10px 14px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>オフラインです</h1>
      <p>通信が戻ったら、保存済みの課題や授業をもう一度開けます。</p>
      <a href="/dashboard">再読み込み</a>
    </main>
  </body>
</html>
